<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Analfabetismo - Plataforma Educativa</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/libros.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 Plataforma Educativa - Proyecto Analfabetismo</h1>
            <div class="user-info">
                <span id="userName">Usuario</span>
                <button id="progressBtn" class="btn-secondary">📊 Mi Progreso</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="libros-section">
            <h2>Selecciona un libro para comenzar</h2>
            <div class="libros-grid" id="librosContainer">
                <!-- Los libros se cargarán dinámicamente -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Proyecto Analfabetismo - Educación para Todos</p>
    </footer>

    <script src="js/progress.js"></script>
    <script src="js/libros.js"></script>
</body>
</html>
